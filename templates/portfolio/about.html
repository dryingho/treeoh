{% extends "base.html" %}
{% block title %}소개 · 오주성{% endblock %}
{% block content %}
<section class="section">
  <div class="section-head">
    <p class="eyebrow">About</p>
    <h2>소개</h2>
  </div>
  <div class="card">
    {% if profile %}
      <h3>{{ profile.display_name }}</h3>
      <p>{{ profile.bio }}</p>
    {% else %}
      <p class="muted">소개가 아직 작성되지 않았습니다.</p>
    {% endif %}
  </div>
</section>
{% endblock %}
