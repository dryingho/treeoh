{% extends "base.html" %}
{% block title %}프로필 사진 업로드{% endblock %}
{% block content %}
<section class="card" style="max-width:620px">
  <h2>프로필 사진 업로드</h2>
  <p class="muted">프로필 사진으로 쓸 이미지를 업로드하세요.</p>

  {% if profile.avatar_url %}
    <p>현재: <a href="{{ profile.avatar_url }}">{{ profile.avatar.name }}</a></p>
  {% endif %}

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <label>이미지 파일</label>
    <input type="file" name="avatar" required>
    <p><button class="btn" type="submit">업로드</button></p>
  </form>
</section>
{% endblock %}
